<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>足球预测台 · Forecast Desk</title>
<meta name="description" content="足球联赛与国家队赛事的概率预测：Dixon-Coles 泊松模型 + Elo + 蒙特卡洛。Football league and tournament forecasts.">
<meta name="theme-color" content="#F5F6F3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23166A52'/%3E%3Crect x='3' y='7' width='10' height='2' fill='%23F5F6F3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F6F3; --surface:#FFFFFF; --ink:#17251F; --muted:#5B6B62; --line:#DCE3DD;
  --accent:#166A52; --amber:#9A6A12; --ucl:#3E6C99; --brick:#A34A3F;
  --g1:#E8F1EC; --g2:#CDE4D8; --g3:#A9CFBB; --g4:#7DB69B; --g5:#4D9375; --g6:#20704F;
  --on5:#FFFFFF;
  --serif:Georgia,'Times New Roman','Songti SC','SimSun',serif;
  --sans:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
}
[data-theme="dark"]{
  --bg:#0E1714; --surface:#15211C; --ink:#E8EFE9; --muted:#9DB0A5; --line:#24372E;
  --accent:#63C9A3; --amber:#E0B25C; --ucl:#7FA6CC; --brick:#D08A80;
  --g1:#1B2A24; --g2:#294236; --g3:#355B49; --g4:#3F7C64; --g5:#4FA987; --g6:#63C9A3;
  --on5:#0E1714;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:0}
h1{font-size:40px;line-height:1.15;margin:40px 0 8px}
h2{font-size:20px;line-height:1.3;margin:0 0 4px}
h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 12px}
a{color:var(--ink);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--muted)}
a.link{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:16px 24px;display:flex;align-items:baseline;gap:32px;flex-wrap:wrap}
.wordmark{font-family:var(--serif);font-size:20px;font-weight:600}
nav.main{display:flex;gap:20px;font-size:14px;color:var(--muted)}
nav.main a[aria-current]{color:var(--ink);box-shadow:inset 0 -1px 0 var(--ink)}
.tools{margin-left:auto;display:flex;gap:8px}
.btn{font:inherit;font-size:12px;background:none;border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:3px 8px;cursor:pointer;transition:border-color 120ms,color 120ms}
.btn:hover{border-color:var(--muted)}
main{max-width:1200px;margin:0 auto;padding:0 24px}
section{margin-top:48px}
.lead{max-width:68ch;color:var(--muted)}
.prose{max-width:68ch}
.prose p{color:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:12px}
.serif{font-family:var(--serif)}
ul.events{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
ul.events li{border-bottom:1px solid var(--line)}
.event-link{display:block;margin:0 -8px;padding:16px 8px;transition:background 120ms}
.event-link:hover{background:var(--surface);text-decoration:none}
.event-name{font-family:var(--serif);font-size:20px;font-weight:600;margin-right:12px}
.event-season{font-size:13px;color:var(--muted);margin-left:8px}
.event-meta{display:block;font-size:13px;color:var(--muted);margin:2px 0 10px}
.badge{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.band{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.band-seg{display:block;min-width:1px}
.band-seg:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hot-row{display:flex;gap:24px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.hot-team{color:var(--muted);margin-right:4px}
.hot-pct{font-family:var(--serif);font-size:14px}
.hot-pct.xl{font-size:28px;line-height:1.1}
.lvl1{background:var(--g1)} .lvl2{background:var(--g2)} .lvl3{background:var(--g3)}
.lvl4{background:var(--g4)} .lvl5{background:var(--g5)} .lvl6{background:var(--g6)}
.controls{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:12px 0 8px;font-size:13px;color:var(--muted)}
.controls label{display:inline-flex;gap:6px;align-items:center}
.controls select{font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t thead th{font-weight:600;color:var(--muted);font-size:12px;border-bottom:1px solid var(--ink)}
table.t tbody th{font-weight:400;color:var(--ink)}
table.t .l{text-align:left}
table.t .stick{position:sticky;left:0;background:var(--bg);z-index:1}
table.t .stick2{position:sticky;left:36px;background:var(--bg);z-index:1}
table.t .rank{width:36px;min-width:36px;padding-left:0;padding-right:6px}
table.t tbody tr:hover td,table.t tbody tr:hover th{background:var(--surface)}
table.t tbody tr:hover .stick,table.t tbody tr:hover .stick2,table.t tbody tr:hover .rank{background:var(--bg)}
table.t tr td:first-child,table.t tr th:first-child{border-left:2px solid transparent}
table.t tr.flag td:first-child,table.t tr.flag th:first-child{border-left:2px solid var(--amber);padding-left:8px}
table.t tr.flag td.rank{padding-left:0}
.zone-head{font-size:12px}
.zone-range{color:var(--muted);font-weight:400;margin-left:4px}
.zbar{display:inline-block;width:44px;height:5px;background:var(--line);margin-right:6px;vertical-align:middle;border-radius:2px;overflow:hidden}
.zbar i{display:block;height:100%;background:var(--muted)}
.z-title i{background:var(--accent)} .z-ucl i{background:var(--ucl)}
.z-amber i{background:var(--amber)} .z-brick i{background:var(--brick)}
.heat th,.heat td{padding:3px 5px;text-align:center;font-size:12px}
.heat .stick{text-align:left;min-width:132px}
.hv1{background:var(--g1)} .hv2{background:var(--g2)} .hv3{background:var(--g3)}
.hv4{background:var(--g4)} .hv5{background:var(--g6);color:var(--on5);font-weight:600}
.tabs{display:flex;gap:22px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:24px 0}
.tabs button{font:inherit;font-size:14px;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 0;color:var(--muted);cursor:pointer;transition:color 120ms,border-color 120ms}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.meta-line{font-size:13px;color:var(--muted);display:flex;gap:20px;flex-wrap:wrap;margin:4px 0 0}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:32px;margin-top:16px}
.group-table{font-size:13px;width:100%;border-collapse:collapse}
.group-table th,.group-table td{padding:3px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.group-table th:first-child,.group-table td:first-child{text-align:left}
.group-table thead th{font-size:12px;color:var(--muted);font-weight:600}
.group-table tbody th{font-weight:400}
.group-table tr.in th,.group-table tr.in td{box-shadow:inset 2px 0 0 var(--ucl)}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}
.match .mt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .mt.r{text-align:right}
.match .mid{text-align:center;color:var(--muted);font-size:12px;min-width:92px}
.round-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:32px;margin-top:16px}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:13px;margin:8px 0 0}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0}
footer{border-top:1px solid var(--line);margin-top:72px;padding:20px 0 48px;font-size:12px;color:var(--muted);display:flex;gap:20px;flex-wrap:wrap;max-width:1200px;margin-left:auto;margin-right:auto;padding-left:24px;padding-right:24px}
#tip{position:fixed;top:0;left:0;z-index:50;max-width:280px;padding:4px 8px;font-size:12px;line-height:1.4;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;pointer-events:none;opacity:0;transition:opacity 120ms}
#tip.on{opacity:1}
@media (max-width:640px){
  .bar,main{padding-left:16px;padding-right:16px}
  h1{font-size:28px;margin-top:28px}
  section{margin-top:40px}
  footer{padding-left:16px;padding-right:16px}
  .event-link{margin:0;padding:14px 0}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const ZONE_COLOR = { title: 'z-title', ucl: 'z-ucl', relegation_playoff: 'z-amber', relegation: 'z-brick' };

// ==UI-CORE-BEGIN==
// 纯函数，不碰 DOM。tests/ui.test.js 会读出这一段并单独求值。
const UI_CORE = {
  DAY: 86400000,

  // 'YYYY-MM-DD' → UTC 毫秒；非法输入返回 NaN（不让本地时区参与）
  parseDay(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso == null ? '' : iso));
    if (!m) return NaN;
    const y = +m[1], mo = +m[2], d = +m[3];
    const ms = Date.UTC(y, mo - 1, d);
    const back = new Date(ms);
    // 拒绝 2026-13-01、2026-02-30 这类会静默进位的日期
    if (back.getUTCFullYear() !== y || back.getUTCMonth() !== mo - 1 || back.getUTCDate() !== d) return NaN;
    return ms;
  },

  // 今天（UTC），now 可以是 Date 或毫秒
  todayISO(now) {
    const ms = now instanceof Date ? now.getTime() : Number(now);
    return new Date(ms).toISOString().slice(0, 10);
  },

  addDays(iso, n) {
    return new Date(UI_CORE.parseDay(iso) + n * 86400000).toISOString().slice(0, 10);
  },

  daysUntil(iso, today) {
    return Math.round((UI_CORE.parseDay(iso) - UI_CORE.parseDay(today)) / 86400000);
  },

  // start > 今天 → upcoming；end < 今天 → ended；否则 live
  eventStatus(ev, today) {
    if (!ev) return 'ended';
    const t = UI_CORE.parseDay(today);
    const start = UI_CORE.parseDay(ev.start);
    const end = UI_CORE.parseDay(ev.end);
    if (ev.start && start > t) return 'upcoming';
    if (ev.end && end < t) return 'ended';
    return 'live';
  },

  fmtPct(x, digits = 1) {
    const p = Number(x);
    if (!isFinite(p) || p <= 0) return '0%';
    if (p >= 0.9995) return '100%';
    if (p < 0.0005) return '<0.1%';
    return (p * 100).toFixed(digits) + '%';
  },

  fmtPp(x) {
    const v = Number(x);
    return (isFinite(v) ? v : 0).toFixed(1) + 'pp';
  },

  // 三结果上 |模型−市场| 的最大值，单位百分点；缺市场返回 null
  disagreement(model, market) {
    if (!Array.isArray(model) || !Array.isArray(market)) return null;
    let max = 0;
    for (let i = 0; i < 3; i++) {
      const a = Number(model[i]), b = Number(market[i]);
      if (!isFinite(a) || !isFinite(b)) return null;
      max = Math.max(max, Math.abs(a - b));
    }
    return max * 100;
  },

  // 名次落在哪个区间（取范围最窄的那个，如第 1 名优先算 title 而不是 ucl）
  positionZone(pos, zones) {
    if (!Array.isArray(zones)) return null;
    let hit = null;
    for (const z of zones) {
      if (pos >= z.from && pos <= z.to) {
        if (!hit || z.to - z.from < hit.to - hit.from) hit = z;
      }
    }
    return hit;
  },

  // 欧战联赛阶段：名次落在哪一段（1–8 直接进 16 强 / 9–24 附加赛 / 25–36 出局）
  currentBand(bands, pos) {
    if (!Array.isArray(bands)) return null;
    const p = Number(pos);
    if (!isFinite(p)) return null;
    for (const b of bands) if (p >= b.from && p <= b.to) return b;
    return null;
  },

  // 夺冠概率带：按概率降序切段，pct 合计恰好 100
  bandSegments(rows) {
    const list = (Array.isArray(rows) ? rows : [])
      .map(r => ({ team: r.team, p: Math.max(0, Number(r.p) || 0) }))
      .filter(r => r.p > 0)
      .sort((a, b) => b.p - a.p || String(a.team).localeCompare(String(b.team)));
    const total = list.reduce((s, r) => s + r.p, 0);
    if (!list.length || !(total > 0)) return [];
    const out = list.map(r => {
      const share = r.p / total;
      return { team: r.team, p: r.p, share, pct: share * 100, level: UI_CORE.bandLevel(share) };
    });
    // 舍入误差补给最大的一段，保证合计 100
    out[0].pct += 100 - out.reduce((s, r) => s + r.pct, 0);
    return out;
  },

  bandLevel(share) {
    if (share >= 0.35) return 6;
    if (share >= 0.15) return 5;
    if (share >= 0.05) return 4;
    if (share >= 0.02) return 3;
    if (share >= 0.005) return 2;
    return 1;
  },

  bandSum(segments) {
    return (Array.isArray(segments) ? segments : []).reduce((s, r) => s + r.pct, 0);
  },

  // 名次热力表：<0.5% 留空（返回 0），其余 1–5 级
  heatLevel(p) {
    const v = Number(p);
    if (!isFinite(v) || v < 0.005) return 0;
    return Math.min(5, Math.max(1, Math.ceil(v * 5)));
  },

  progressRatio(played, remaining) {
    const a = Number(played) || 0, b = Number(remaining) || 0;
    if (a + b <= 0) return 0;
    return a / (a + b);
  },

  seasonLabel(s) {
    const t = String(s == null ? '' : s);
    return /^\d{4}$/.test(t) ? t.slice(0, 2) + '/' + t.slice(2) : t;
  },

  // 日期落在 [from, from+days] 内（含端点）
  inWindow(iso, from, days) {
    const d = UI_CORE.parseDay(iso), a = UI_CORE.parseDay(from);
    if (!isFinite(d) || !isFinite(a)) return false;
    return d >= a && d <= a + days * 86400000;
  },

  // 升序取前 n（date 相同按下一关键字）
  takeFirst(rows, n, key) {
    const list = (Array.isArray(rows) ? rows : []).slice();
    list.sort((a, b) => key(a) - key(b));
    return list.slice(0, n);
  },

  // 窗口内有比赛就用窗口，否则退回最近 n 场（先过去的，再未来的）。空输入不报错。
  fixtureRows(rows, today, days, n = 10) {
    const list = Array.isArray(rows) ? rows.filter(r => r && r.date) : [];
    const inWin = list.filter(r => UI_CORE.inWindow(r.date, today, days));
    if (inWin.length) {
      inWin.sort((a, b) => (UI_CORE.parseDay(a.date) - UI_CORE.parseDay(b.date)) || String(a.league || '').localeCompare(String(b.league || '')));
      return { rows: inWin, fallback: false, empty: false };
    }
    const t = UI_CORE.parseDay(today);
    const past = list.filter(r => UI_CORE.parseDay(r.date) <= t)
      .sort((a, b) => UI_CORE.parseDay(b.date) - UI_CORE.parseDay(a.date));
    const future = list.filter(r => UI_CORE.parseDay(r.date) > t)
      .sort((a, b) => UI_CORE.parseDay(a.date) - UI_CORE.parseDay(b.date));
    const rowsOut = past.concat(future).slice(0, n);
    return { rows: rowsOut, fallback: true, empty: rowsOut.length === 0 };
  }
};
// ==UI-CORE-END==

const C = UI_CORE;
const state = {
  lang: localStorage.getItem('fd-lang') === 'en' ? 'en' : 'zh',
  theme: localStorage.getItem('fd-theme') === 'dark' ? 'dark' : 'light',
  index: [],
  events: new Map(),
  booted: false,
  error: '',
  tab: null,
  tabFor: '',
  weekLeague: '',
  weekGapOnly: false
};

const L = () => T[state.lang];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = x => Number(x).toLocaleString('en-US');

function fmtDate(iso, full) {
  const ms = C.parseDay(iso);
  if (!isFinite(ms)) return iso ? String(iso) : '—';
  const d = new Date(ms);
  if (state.lang === 'zh') return full ? `${d.getUTCFullYear()}年${d.getUTCMonth() + 1}月${d.getUTCDate()}日` : `${d.getUTCMonth() + 1}月${d.getUTCDate()}日`;
  return full ? `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}` : `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}`;
}
const fmtRange = (a, b) => `${fmtDate(a, true)} – ${fmtDate(b, true)}`;

function evMeta(id) { return state.index.find(e => e.id === id) || null; }
function evName(meta, d) {
  if (!meta && d) meta = d.league || d.event || {};
  if (!meta) return '';
  return state.lang === 'zh' ? (meta.nameZh || meta.name || meta.id) : (meta.name || meta.nameZh || meta.id);
}
function teamName(d, t) {
  return state.lang === 'zh' && d && d.names && d.names[t] ? d.names[t] : t;
}
function zoneLabel(z) { return state.lang === 'zh' ? (z.label || z.labelEn || z.key) : (z.labelEn || z.label || z.key); }
function zoneCls(key) { return ZONE_COLOR[key] || 'z-muted'; }
function seasonOf(d) {
  if (!d) return '';
  if ((d.kind === 'league' || d.kind === 'swiss') && d.league && d.league.season) return C.seasonLabel(d.league.season);
  return '';
}
// 国家队赛事的 JSON 没有 kind 字段，一律按「不是联赛/欧战就是国家队赛事」判断
function kindOf(d) {
  const k = d && d.kind;
  return k === 'league' || k === 'swiss' || k === 'groups2leg' ? k : 'tournament';
}

function champRows(d) {
  if (!d || !Array.isArray(d.teams)) return [];
  const k = kindOf(d);
  return d.teams.map(t => ({
    team: t.team,
    p: k === 'league' ? ((t.zones && t.zones.title) || 0)
      : k === 'swiss' ? ((t.knockout && t.knockout.title) || 0)
        : (t.champion || 0),
  }));
}
function eventDates(meta, d) {
  const s = (meta && meta.start) || (d && ((d.league && d.league.start) || (d.event && d.event.start)));
  const e = (meta && meta.end) || (d && ((d.league && d.league.end) || (d.event && d.event.end)));
  return { start: s, end: e };
}

// ── 小部件 / widgets ──────────────────────────────────────────────────────
function bandHtml(d, segs, ariaExtra) {
  if (!segs.length) return '';
  const top = segs.slice(0, 3).map(s => `${teamName(d, s.team)} ${C.fmtPct(s.p)}`);
  let h = `<div class="band" role="group" aria-label="${esc(L().bandAria(top.join(state.lang === 'zh' ? '、' : ', ')))}">`;
  for (const s of segs) {
    const label = `${teamName(d, s.team)} ${C.fmtPct(s.p)}`;
    const focus = s.pct >= 1 ? ' tabindex="0"' : '';
    h += `<span class="band-seg lvl${s.level}" role="img"${focus} aria-label="${esc(label)}" data-tip="${esc(label)}" style="flex:${s.pct.toFixed(3)} 1 0"></span>`;
  }
  return h + '</div>';
}

function hotRow(d, segs) {
  if (!segs.length) return '';
  return '<div class="hot-row">' + segs.slice(0, 3).map((s, i) =>
    `<span class="hot"><span class="hot-team">${esc(teamName(d, s.team))}</span> <span class="hot-pct${i === 0 ? ' xl' : ''}">${C.fmtPct(s.p)}</span></span>`
  ).join('') + '</div>';
}

function wdlCell(p) {
  if (!Array.isArray(p) || p.length < 3) return '<span class="muted">—</span>';
  return `${C.fmtPct(p[0])} · ${C.fmtPct(p[1])} · ${C.fmtPct(p[2])}`;
}

function weekTable(rows, note, marketLabel) {
  const t = L();
  if (!rows.length) return `<p class="muted">${esc(t.noFixtures)}</p>`;
  const cap = note === undefined ? t.weekNote : note;
  const mkLabel = marketLabel || t.noMarket;
  let h = `<div class="scroll"><table class="t">${cap ? `<caption class="small muted" style="text-align:left;padding:0 0 8px">${esc(cap)}</caption>` : ''}`
    + `<thead><tr><th scope="col" class="l">${esc(t.date)}</th><th scope="col" class="l">${esc(t.league)}</th><th scope="col" class="l">${esc(t.fixture)}</th>`
    + `<th scope="col">${esc(t.modelWDL)}</th><th scope="col">${esc(t.marketWDL)}</th><th scope="col">${esc(t.gap)}</th></tr></thead><tbody>`;
  let flagged = false;
  for (const r of rows) {
    const gap = C.disagreement(r.model, r.market);
    const flag = gap != null && gap >= 8;
    if (flag) flagged = true;
    h += `<tr${flag ? ' class="flag"' : ''}><td class="l">${esc(fmtDate(r.date))}</td><td class="l">${esc(r.leagueName)}</td>`
      + `<td class="l">${esc(teamName(r.data, r.home))} – ${esc(teamName(r.data, r.away))}</td>`
      + `<td>${wdlCell(r.model)}</td><td>${r.market ? wdlCell(r.market) : `<span class="muted">${esc(mkLabel)}</span>`}</td>`
      + `<td>${gap == null ? '—' : esc(C.fmtPp(gap))}</td></tr>`;
  }
  h += '</tbody></table></div>';
  if (flagged) h += `<p class="muted small" style="margin:8px 0 0">${esc(t.gapRisk)}</p>`;
  return h;
}

function collectFixtures() {
  const out = [];
  for (const meta of state.index) {
    const d = state.events.get(meta.id);
    if (!d || kindOf(d) !== 'league' || !Array.isArray(d.upcoming)) continue;
    for (const m of d.upcoming) {
      out.push({ date: m.date, league: meta.id, leagueName: evName(meta), home: m.home, away: m.away, model: [m.pH, m.pD, m.pA], market: m.market || null, data: d });
    }
  }
  return out;
}

function fixturesPanel(days, title) {
  const t = L(), today = C.todayISO(Date.now());
  const all = collectFixtures();
  const leagues = state.index.filter(m => state.events.has(m.id) && kindOf(state.events.get(m.id)) === 'league');
  const filtered = state.weekLeague ? all.filter(r => r.league === state.weekLeague) : all;
  const res = C.fixtureRows(filtered, today, days, 10);
  const rows = res.rows.filter(r => !state.weekGapOnly || (C.disagreement(r.model, r.market) ?? 0) >= 8);
  const maxDate = all.reduce((m, r) => (C.parseDay(r.date) > m ? C.parseDay(r.date) : m), 0);

  let h = `<section aria-labelledby="sec-week"><h2 id="sec-week">${esc(title)}</h2>`;
  h += `<div class="controls"><label>${esc(t.leagueFilter)} <select id="leagueFilter" aria-label="${esc(t.leagueFilter)}">`
    + `<option value="">${esc(t.allLeagues)}</option>`
    + leagues.map(m => `<option value="${esc(m.id)}"${state.weekLeague === m.id ? ' selected' : ''}>${esc(evName(m))}</option>`).join('')
    + `</select></label><label><input type="checkbox" id="onlyGap"${state.weekGapOnly ? ' checked' : ''}> ${esc(t.onlyGap)}</label></div>`;
  if (res.fallback && maxDate) h += `<p class="muted small">${esc(t.weekFallback(fmtDate(new Date(maxDate).toISOString().slice(0, 10))))}</p>`;
  h += weekTable(rows);
  return h + '</section>';
}

// ── 总览 / overview ───────────────────────────────────────────────────────
function eventRow(meta, d, today) {
  const t = L(), segs = C.bandSegments(champRows(d));
  const dates = eventDates(meta, d);
  const status = C.eventStatus(dates, today);
  const season = seasonOf(d);
  let progress;
  if (kindOf(d) === 'league') {
    const total = (d.played || 0) + (d.remaining || 0);
    const ratio = C.progressRatio(d.played, d.remaining);
    progress = `${t.played} ${num(d.played || 0)} / ${num(total)} · ${C.fmtPct(ratio, 0)}`;
  } else if (kindOf(d) !== 'tournament' && d.played != null) {
    const total = (d.played || 0) + (d.remaining || 0);
    progress = `${t.played} ${num(d.played || 0)} / ${num(total)} · ${C.fmtPct(C.progressRatio(d.played, d.remaining), 0)}`;
  } else {
    progress = `${t.played} ${num(d.playedMatches || 0)} ${t.matches}`;
  }
  const badge = status === 'upcoming'
    ? `<span class="badge">${esc(t.startsIn(Math.max(0, C.daysUntil(dates.start, today))))}</span>`
    : '';
  return `<li><a class="event-link" href="#/e/${encodeURIComponent(meta.id)}">`
    + `<span class="event-name">${esc(evName(meta))}</span>${season ? `<span class="event-season">${esc(season)}</span>` : ''}${badge}`
    + `<span class="event-meta">${esc(fmtRange(dates.start, dates.end))} · ${esc(progress)} · ${esc(t.dataThrough)} ${esc(fmtDate(d.dataThrough, true))}</span>`
    + bandHtml(d, segs) + hotRow(d, segs)
    + `</a></li>`;
}

function overviewPage() {
  const t = L(), today = C.todayISO(Date.now());
  const loaded = state.index.filter(m => state.events.has(m.id));
  const live = loaded.filter(m => C.eventStatus(eventDates(m, state.events.get(m.id)), today) === 'live')
    .sort((a, b) => String(eventDates(a).start).localeCompare(String(eventDates(b).start)));
  const upcoming = loaded.filter(m => C.eventStatus(eventDates(m, state.events.get(m.id)), today) === 'upcoming')
    .sort((a, b) => String(eventDates(a).start).localeCompare(String(eventDates(b).start)));
  const ended = loaded.filter(m => C.eventStatus(eventDates(m, state.events.get(m.id)), today) === 'ended');

  let h = `<h1>${esc(t.h1)}</h1><p class="lead">${esc(t.intro)}</p>`;
  h += `<section aria-labelledby="sec-live"><h2 id="sec-live">${esc(t.secLive)}</h2>`;
  h += live.length
    ? `<ul class="events">${live.map(m => eventRow(m, state.events.get(m.id), today)).join('')}</ul>`
    : `<p class="muted">${esc(t.noLive)}</p>`;
  h += '</section>';
  h += fixturesPanel(7, t.secWeek);
  h += `<section aria-labelledby="sec-soon"><h2 id="sec-soon">${esc(t.secUpcoming)}</h2>`;
  h += upcoming.length
    ? `<ul class="events">${upcoming.map(m => eventRow(m, state.events.get(m.id), today)).join('')}</ul>`
    : `<p class="muted">${esc(t.noUpcoming)}</p>`;
  h += '</section>';
  h += `<section aria-labelledby="sec-arch"><h2 id="sec-arch">${esc(t.secArchive)}</h2>`
    + `<p><a class="link" href="#/archive">${esc(t.archiveLink(ended.length))}</a></p></section>`;
  return h;
}

// ── 赛事页 / event ────────────────────────────────────────────────────────
function leagueTabs() { return ['table', 'heat', 'fixtures', 'reliability']; }
function tournamentTabs() { return ['odds', 'groups', 'knockout', 'fixtures', 'reliability']; }
function swissTabs() { return ['swissStage', 'knockout', 'fixtures', 'reliability']; }
function groups2legTabs() { return ['groupStage', 'knockout', 'fixtures', 'reliability']; }

function tabsHtml(keys) {
  const t = L();
  return `<div class="tabs" role="tablist" aria-label="${esc(t.tabsAria)}">` + keys.map(k =>
    `<button type="button" role="tab" id="tab-${k}" aria-controls="panel" aria-selected="${state.tab === k}" data-tab="${k}">${esc(t.tabs[k])}</button>`

}

function miniBar(p, cls) {
  return `<span class="zbar ${cls}"><i style="width:${Math.min(100, Math.max(0, p * 100)).toFixed(1)}%"></i></span>`;
}

function standingsPanel(d) {
  const t = L(), zones = d.zonesDef || [], n = d.teams.length;
  let h = `<div class="scroll"><table class="t"><thead><tr>`
    + `<th scope="col" class="l rank stick">${esc(t.position)}</th><th scope="col" class="l stick2">${esc(t.team)}</th>`
    + `<th scope="col">${esc(t.pld)}</th><th scope="col">${esc(t.pts)}</th><th scope="col">${esc(t.gd)}</th><th scope="col">${esc(t.xp)}</th>`;

function leagueFixturesPanel(d) {

function methodRows(v, d) {
  const t = L();
  const rows = [];
  const push = (label, o) => {
    if (!o) return;
    rows.push({ label, rps: o.rps, logLoss: o.logLoss, accuracy: o.accuracy, ece: o.ece });
  };
  push(t.modelRow, v.model);
  push(t.marketRow, v.market);
  push(t.eloRow, v.eloBaseline);
  if (v.baseRates) rows.push({ label: t.baseRates, rps: v.baseRates.rps, logLoss: v.baseRates.logLoss, accuracy: null, ece: null });
  return rows;
}

function validationTable(v, d) {
  const t = L();
  const rows = methodRows(v, d);
  if (!rows.length) return '';
  let h = `<div class="scroll"><table class="t"><thead><tr><th scope="col" class="l">${esc(t.source)}</th><th scope="col">RPS</th><th scope="col">log-loss</th>`
    + `<th scope="col">${esc(t.hitRate)}</th><th scope="col">ECE</th></tr></thead><tbody>`;
  for (const r of rows) {
    h += `<tr><th scope="row" class="l">${esc(r.label)}</th><td>${Number(r.rps).toFixed(4)}</td><td>${Number(r.logLoss).toFixed(4)}</td>`
      + `<td>${r.accuracy == null ? '—' : C.fmtPct(r.accuracy)}</td><td>${r.ece == null ? '—' : Number(r.ece).toFixed(4)}</td></tr>`;
  }
  return h + '</tbody></table></div>';
}

function seasonBrierTable(s) {
  const t = L();
  if (!s || !s.fixed || !s.withSigma) return '';
  const a = s.fixed, b = s.withSigma;
  let h = `<div class="scroll"><table class="t"><thead><tr><th scope="col" class="l">${esc(t.zoneCol)}</th>`
    + `<th scope="col">${esc(t.fixedSigma)}</th><th scope="col">${esc(t.withSigma(b.sigma))}</th></tr></thead><tbody>`;
  for (const k of ['title', 'top4', 'bottom3']) {
    if (!a[k] || !b[k]) continue;
    h += `<tr><th scope="row" class="l">${esc(t.zoneRow[k])}</th><td>${a[k].brier.toFixed(5)}</td><td>${b[k].brier.toFixed(5)}</td></tr>`;
  }
  h += `<tr><th scope="row" class="l">${esc(t.meanBrier)}</th><td>${a.meanBrier.toFixed(5)}</td><td>${b.meanBrier.toFixed(5)}</td></tr>`;
  const ra = a.rmsePts, rb = b.rmsePts != null ? b.rmsePts : b.rmse;
  if (ra != null && rb != null) h += `<tr><th scope="row" class="l">${esc(t.rmse)}</th><td>${ra.toFixed(2)}</td><td>${rb.toFixed(2)}</td></tr>`;
  return h + '</tbody></table></div>';
}

function calibrationTable(bins) {
  const t = L();
  if (!Array.isArray(bins) || !bins.length) return '';
  let h = `<div class="scroll"><table class="t"><thead><tr><th scope="col" class="l">${esc(t.predRange)}</th><th scope="col">${esc(t.n)}</th>`
    + `<th scope="col">${esc(t.avgPred)}</th><th scope="col">${esc(t.actualFreq)}</th></tr></thead><tbody>`;
  for (const b of bins) {
    if (!b.n) continue;
    h += `<tr><td class="l">${(b.lo * 100).toFixed(0)}–${(b.hi * 100).toFixed(0)}%</td><td>${num(b.n)}</td><td>${C.fmtPct(b.pred)}</td><td>${C.fmtPct(b.freq)}</td></tr>`;
  }
  return h + '</tbody></table></div>';
}

function reliabilityPanel(d) {
  const t = L(), v = d.validation;
  let h = `<h2>${esc(t.reliability)}</h2><p class="lead">${esc(t.reliabilityIntro)}</p>`;
  if (!v || !v.model) return h + `<p class="muted">${esc(t.noValidation)}</p>`;
  h += `<h3>${esc(t.matchLevel)}</h3>`;
  if (v.note) h += `<p class="muted small">${esc(v.note)}</p>`;
  h += validationTable(v, d);
  if (v.market && v.model && v.model.rps > v.market.rps) {
    h += `<p class="small">${esc(state.lang === 'zh'
      ? `如实说：模型在比赛级上不如市场——RPS ${v.model.rps.toFixed(4)} vs ${v.market.rps.toFixed(4)}，log-loss ${v.model.logLoss.toFixed(4)} vs ${v.market.logLoss.toFixed(4)}。市场有伤停和阵容信息，这里只有比分历史。`
      : `To be clear: at match level the model is worse than the market — RPS ${v.model.rps.toFixed(4)} vs ${v.market.rps.toFixed(4)}, log-loss ${v.model.logLoss.toFixed(4)} vs ${v.market.logLoss.toFixed(4)}. The market knows about injuries and line-ups; this model only knows scorelines.`)}</p>`;
  }
  if (v.season) {
    h += `<h3>${esc(t.seasonLevel)}</h3>`;

}

/** 阶段名：联赛阶段带轮次（第 N 轮 / MD N），淘汰赛用阶段名。 */
function stageLabel(stage, matchday) {
  const t = L();
  const base = (t.stageNames && t.stageNames[stage]) || stage || '';
  return matchday ? `${base} · ${t.matchday(matchday)}` : base;
}

const BAND_CLS = { r16: 'z-title', playoff: 'z-ucl', out: 'z-brick' };

/** 欧冠联赛阶段 36 队表：当前名次 / 期望积分 / 三条区间概率 / 夺冠。 */
function swissTablePanel(d) {
  const t = L(), bands = d.bandsDef || [];
  let h = `<div class="scroll"><table class="t"><thead><tr>`
    + `<th scope="col" class="l rank stick">${esc(t.position)}</th><th scope="col" class="l stick2">${esc(t.team)}</th>`
    + `<th scope="col">${esc(t.pld)}</th><th scope="col">${esc(t.pts)}</th><th scope="col">${esc(t.gd)}</th><th scope="col">${esc(t.xp)}</th>`;
  for (const b of bands) h += `<th scope="col" class="zone-head">${esc(zoneLabel(b))} <span class="zone-range">${b.from === b.to ? b.from : b.from + '–' + b.to}</span></th>`;
  h += `<th scope="col">${esc(t.champion)}</th></tr></thead><tbody>`;
  for (const team of d.teams) {
    const c = team.current || {};
    const gd = Number(c.gd) || 0;
    h += `<tr><td class="l rank stick">${team.position}</td><th scope="row" class="l stick2">${esc(teamName(d, team.team))}</th>`
      + `<td>${num(c.p || 0)}</td><td>${num(c.pts || 0)}</td><td>${gd > 0 ? '+' + gd : gd}</td><td>${Number(team.expectedPts || 0).toFixed(1)}</td>`;
    for (const b of bands) {

function euroFixturesPanel(d) {
  const t = L(), today = C.todayISO(Date.now());

function eventPage(id) {
  const t = L();
  const meta = evMeta(id), d = state.events.get(id);
  if (!meta) return `<h1>${esc(t.notFound)}</h1><p><a class="link" href="#/">${esc(t.back)}</a></p>`;
  if (!d) return `<h1>${esc(evName(meta))}</h1><p class="muted">${esc(t.loading)}</p>`;
  if (state.tabFor !== id) { state.tabFor = id; state.tab = null; }
  const kind = kindOf(d);
  const keys = kind === 'league' ? leagueTabs() : kind === 'swiss' ? swissTabs() : kind === 'groups2leg' ? groups2legTabs() : tournamentTabs();
  if (!keys.includes(state.tab)) state.tab = keys[0];
  const dates = eventDates(meta, d);
  const segs = C.bandSegments(champRows(d));

  let h = `<h1>${esc(evName(meta))}</h1>`;
  h += `<div class="meta-line"><span>${esc(fmtRange(dates.start, dates.end))}</span>`;
  if (seasonOf(d)) h += `<span>${esc(seasonOf(d))}</span>`;
  h += `<span>${esc(t.modelAsOf)} ${esc(fmtDate(d.asOf, true))}</span><span>${esc(t.dataThrough)} ${esc(fmtDate(d.dataThrough, true))}</span>`
    + `<span>${num(d.sims || 0)} ${esc(t.sims)}</span>`;
  if (kindOf(d) === 'league') h += `<span>${esc(t.played)} ${num(d.played || 0)} / ${num((d.played || 0) + (d.remaining || 0))}</span>`;
  else if (kindOf(d) !== 'tournament' && d.played != null) h += `<span>${esc(t.played)} ${num(d.played || 0)} / ${num((d.played || 0) + (d.remaining || 0))}</span>`;
  else h += `<span>${esc(t.played)} ${num(d.playedMatches || 0)} ${esc(t.matches)}</span>`;
  h += '</div>';
  h += `<div style="margin-top:20px">${bandHtml(d, segs)}${hotRow(d, segs)}</div>`;
  if (d.approximateThirdsShare > 0) h += `<p class="muted small" style="margin-top:8px">${esc(state.lang === 'zh' ? '本赛事未提供官方第三名组合表，第三名对阵按约束近似分配。' : 'No official third-place table for this event; third-place pairings use a constraint-based approximation.')}</p>`;
  h += tabsHtml(keys);

  let panel = '';
  if (kind === 'league') {
    if (state.tab === 'table') panel = standingsPanel(d);
    else if (state.tab === 'heat') panel = heatPanel(d);
    else if (state.tab === 'fixtures') panel = leagueFixturesPanel(d);
    else panel = reliabilityPanel(d);
  } else if (kind === 'swiss') {
    if (state.tab === 'swissStage') panel = swissTablePanel(d);
    else if (state.tab === 'knockout') panel = swissKnockoutPanel(d);
    else if (state.tab === 'fixtures') panel = euroFixturesPanel(d);
    else panel = reliabilityPanel(d);
  } else if (kind === 'groups2leg') {
    if (state.tab === 'groupStage') panel = groupStagePanel(d);
    else if (state.tab === 'knockout') panel = knockoutPanel(d);
    else if (state.tab === 'fixtures') panel = euroFixturesPanel(d);
    else panel = reliabilityPanel(d);
  } else {
    if (state.tab === 'odds') panel = oddsPanel(d);
    else if (state.tab === 'groups') panel = groupsPanel(d);
    else if (state.tab === 'knockout') panel = knockoutPanel(d);
    else if (state.tab === 'fixtures') panel = groupFixturesPanel(d);
    else panel = reliabilityPanel(d);
  }
  return h + `<div id="panel" role="tabpanel" aria-labelledby="tab-${state.tab}" tabindex="0">${panel}</div>`;
}

// ── 方法 / method ─────────────────────────────────────────────────────────
function pickValid(kind) {
  for (const m of state.index) {
    const d = state.events.get(m.id);
    if (d && kindOf(d) === kind && d.validation && d.validation.model) return { meta: m, d };
  }
  return null;
}

function methodPage() {
  const t = L(), zh = state.lang === 'zh';
  const lg = pickValid('league'), tr = pickValid('tournament');
  let h = `<h1>${esc(t.methodH1)}</h1>`;

  h += `<section><h2>${esc(t.methodSections.model)}</h2><div class="prose">`;
  h += zh
    ? `<p>Dixon-Coles 双泊松模型：每支球队有一个进攻强度和一个防守强度，主场优势单独一项，低比分用 ρ 修正。参数按比赛日期做时间衰减加权（近的比赛权重高），国家队再并入 World Football Elo（Elo 差换算成进球差）。</p>
       <p>每场比赛由比分矩阵给出主胜、平、客胜三个概率。赛季结局用蒙特卡洛：联赛把剩余比赛按比分分布抽完，再按该联赛公开的同分规则（净胜球、进球数、相互战绩）排名；杯赛按赛制推进（小组排名含相互战绩、第三名分配、淘汰赛加时与点球）。页面上的每个百分比都是这类模拟的频率。</p>
       <p>每支球队的实力还带一点不确定性：每次模拟前给攻防参数抽一次扰动（σ），这样名次概率不会被算得过窄。</p>`
    : `<p>Dixon-Coles bivariate Poisson: every team carries an attack and a defence strength, home advantage is a separate term, and low-scoring results get a ρ correction. Parameters are weighted by match date (recent matches count more) and, for internationals, blended with World Football Elo (an Elo gap becomes a goal gap).</p>
       <p>Each match yields home/draw/away probabilities from its score matrix. Season outcomes come from Monte Carlo: remaining league matches are drawn from those score matrices and ranked by the league's published tie-break rules (goal difference, goals scored, head-to-head); tournaments are played out by their format (group ranking with head-to-head, third-place allocation, extra time and penalties in the knockout). Every percentage on the page is a frequency from those runs.</p>
       <p>Team strength also carries uncertainty: before each run the attack and defence parameters get one perturbation draw (σ), so position odds are not too narrow.</p>`;
  h += '</div></section>';

  h += `<section><h2>${esc(t.methodSections.data)}</h2><div class="prose">`;
  h += zh
    ? `<p>俱乐部比赛来自 football-data.co.uk 的各赛季 CSV（英西德意法五个联赛 + 葡超、荷甲、比甲、苏超两级、土超、希超；次级联赛只用来给升班马定级，不参与报告）；国家队比赛来自公开的国际比赛记录；欧战（欧冠联赛阶段、解放者杯）的比赛与比分来自 football-data.org 免费档，这个档位没有赔率，所以这两项赛事的市场对照一律显示「—」。市场概率来自 Pinnacle / 平均收盘赔率去抽水后的隐含概率。每个赛事 JSON 里的 <code>dataThrough</code> 是数据截止日，<code>asOf</code> 是模型生成日。</p>`
    : `<p>Club matches come from the football-data.co.uk season CSVs (the big five plus Primeira Liga, Eredivisie, Belgian Pro League, both Scottish tiers, Süper Lig and Super League Greece; second tiers are used only to rate promoted teams and are not reported); internationals come from public match records; European matches (Champions League league phase, Copa Libertadores) and their scores come from the free football-data.org tier, which carries no odds, so the market column is always “—” for those two events. Market probabilities are implied from Pinnacle / average closing odds with the margin removed. In each event JSON, <code>dataThrough</code> is the data cutoff and <code>asOf</code> is the day the model was generated.</p>`;
  h += '</div></section>';

  h += `<section><h2>${esc(t.methodSections.split)}</h2><div class="prose">`;
  h += zh
    ? `<p>俱乐部模型只在 13/14–16/17 赛季上调参（半衰期、窗口、先验、σ），17/18–25/26 赛季只用于报告；国家队模型只在 2010–2016 年的届次上调参，2017 年以后的届次只用于报告。检验时滚动重拟合：预测每场比赛只用该场之前的数据，预测每个赛季检查点只用检查点之前的真实比分。</p>`
    : `<p>The club model is tuned on 13/14–16/17 only (half-life, window, prior, σ); 17/18–25/26 is reporting only. The international model is tuned on 2010–2016 events; anything from 2017 on is reporting only. Tests refit on a rolling basis: each match is predicted from earlier matches only, and each season checkpoint from earlier results only.</p>`;
  h += '</div></section>';

  h += `<section><h2>${esc(t.methodSections.verdict)}</h2><div class="prose">`;
  if (lg) {
    const v = lg.d.validation, m = v.model, mk = v.market, e = v.eloBaseline;
    h += zh
      ? `<p>比赛级上模型不如市场：${esc(evName(lg.meta))} 测试集 ${num(m.n)} 场，RPS ${m.rps.toFixed(4)}（市场 ${mk ? mk.rps.toFixed(4) : '—'}，Elo 基线 ${e.rps.toFixed(4)}），log-loss ${m.logLoss.toFixed(4)}（市场 ${mk ? mk.logLoss.toFixed(4) : '—'}），命中率 ${C.fmtPct(m.accuracy)}（市场 ${mk ? C.fmtPct(mk.accuracy) : '—'}），ECE ${m.ece.toFixed(4)}。市场聚合了伤停与阵容信息，本模型只有比分历史，输给它很正常。</p>`
      : `<p>At match level the model is worse than the market: on ${num(m.n)} test matches in ${esc(evName(lg.meta))}, RPS ${m.rps.toFixed(4)} (market ${mk ? mk.rps.toFixed(4) : '—'}, Elo baseline ${e.rps.toFixed(4)}), log-loss ${m.logLoss.toFixed(4)} (market ${mk ? mk.logLoss.toFixed(4) : '—'}), hit rate ${C.fmtPct(m.accuracy)} (market ${mk ? C.fmtPct(mk.accuracy) : '—'}), ECE ${m.ece.toFixed(4)}. The market aggregates injuries and line-ups; this model only knows scorelines, so losing to it is expected.</p>`;
  }
  if (tr) {
    const v = tr.d.validation, m = v.model, e = v.eloBaseline, b = v.baseRates;
    h += zh
      ? `<p>国家队赛事（${esc(evName(tr.meta))}）${m.n ? `测试集 ${num(m.n)} 场` : '样本外'}的结果：RPS ${m.rps.toFixed(4)}（Elo 基线 ${e.rps.toFixed(4)}${b ? `，基准率 ${b.rps.toFixed(4)}` : ''}），log-loss ${m.logLoss.toFixed(4)}${b ? `（基准率 ${b.logLoss.toFixed(4)}）` : ''}，命中率 ${C.fmtPct(m.accuracy)}，ECE ${m.ece.toFixed(4)}。</p>`
      : `<p>International events (${esc(evName(tr.meta))}) out of sample: RPS ${m.rps.toFixed(4)} (Elo baseline ${e.rps.toFixed(4)}${b ? `, base rates ${b.rps.toFixed(4)}` : ''}), log-loss ${m.logLoss.toFixed(4)}${b ? ` (base rates ${b.logLoss.toFixed(4)})` : ''}, hit rate ${C.fmtPct(m.accuracy)}, ECE ${m.ece.toFixed(4)}.</p>`;
  }
  if (lg && lg.d.validation.season && lg.d.validation.season.withSigma) {
    const s = lg.d.validation.season, b = s.withSigma, cal = (b.cal && b.cal.title) || (b.calibration && b.calibration.title) || [];
    const bin = cal.find(x => x.lo >= 0.8 && x.hi <= 0.95) || cal.find(x => x.hi > 0.8 && x.lo < 0.95);
    h += zh
      ? `<p>赛季级上，名次概率的校准是好的：${esc(bin ? `我们把一支队夺冠概率算在 ${(bin.lo * 100).toFixed(0)}–${(bin.hi * 100).toFixed(0)}% 时，实际有 ${C.fmtPct(bin.freq, 0)} 夺冠（${num(bin.n)} 个球队-赛季-检查点）` : '预测区间与实际的偏差很小')}。平均 Brier：固定实力 ${s.fixed.meanBrier.toFixed(5)}，含不确定性 ${b.meanBrier.toFixed(5)}。</p>`
      : `<p>At season level the position odds are well calibrated: ${esc(bin ? `when we gave a team a ${(bin.lo * 100).toFixed(0)}–${(bin.hi * 100).toFixed(0)}% chance of the title, it actually won ${C.fmtPct(bin.freq, 0)} of the time (${num(bin.n)} team-season-checkpoints)` : 'predicted ranges and outcomes differ very little')}. Mean Brier: fixed strength ${s.fixed.meanBrier.toFixed(5)}, with uncertainty ${b.meanBrier.toFixed(5)}.</p>`;
  }
  h += '</div></section>';

  if (lg) {
    const v = lg.d.validation;
    h += `<section><h2>${esc(t.matchLevel)}</h2><p class="muted small">${esc(evName(lg.meta))} · ${esc(v.note || '')}</p>`;
    h += validationTable(v, lg.d);
    h += '</section>';
  }
  if (tr) {
    const v = tr.d.validation;
    h += `<section><h2>${esc(state.lang === 'zh' ? '国家队比赛级检验' : 'International match-level test')}</h2><p class="muted small">${esc(evName(tr.meta))} · ${esc(v.note || '')}</p>`;
    h += validationTable(v, tr.d);
    h += '</section>';
  }
  if (lg && lg.d.validation.season) {
    const s = lg.d.validation.season, b = s.withSigma;
    h += `<section><h2>${esc(t.seasonLevel)}</h2><p class="muted small">${esc(s.note || '')}</p>`;
    h += seasonBrierTable(s);
    if (b) {
      const cal = (b.cal && b.cal.title) || (b.calibration && b.calibration.title) || [];
      if (cal.length) {
        h += `<h3 style="margin-top:16px">${esc(t.calibration)} (σ=${esc(b.sigma)})</h3>`;
        h += calibrationTable(cal);
      }
    }
    h += '</section>';
  }

  h += `<section><h2>${esc(t.methodSections.limits)}</h2><div class="prose"><p>`;
  h += zh
    ? '模型只用比分历史：没有伤停、阵容、转会、赛程密度、天气和裁判信息，也不读新闻。淘汰赛的点球按五五开；小组同分规则按公开规则近似（法甲为近似、意甲附加赛按五五开）；数据集比分含加时、不含点球。欧战的附加赛/16 强配对与 8 强、4 强首回合主场按官方结构随机近似（真实是抽签），解放者杯的南美俱乐部没有国内联赛数据、只能靠本赛事比赛定级；这两项赛事也没有免费赔率可对照。所以这里的概率适合比较球队之间的强弱和区间的量级，不适合当成投注建议。'
    : 'The model only sees scorelines: no injuries, line-ups, transfers, fixture congestion, weather or referees, and it reads no news. Knockout penalties are a coin flip; group tie-breaks follow the published rules approximately (Ligue 1 approximated, Serie A play-offs 50/50); the dataset includes extra time but not penalty shootouts. For the European events the play-off and round-of-16 pairings, and home order in the quarter- and semi-finals, follow the official bracket with random assignment (the real thing is a draw); the South American clubs have no domestic data and are rated from Libertadores matches only; and neither European event offers free odds to compare against. So these probabilities are good for comparing teams and the size of a zone, not for betting.';
  h += '</p></div></section>';
  return h;
}

// ── 归档 / archive ────────────────────────────────────────────────────────
function archivePage() {
  const t = L(), today = C.todayISO(Date.now());
  const ended = state.index.filter(m => state.events.has(m.id) && C.eventStatus(eventDates(m, state.events.get(m.id)), today) === 'ended')
    .sort((a, b) => String(eventDates(b).end).localeCompare(String(eventDates(a).end)));
  let h = `<h1>${esc(t.archiveH1)}</h1><p class="lead">${esc(t.archiveIntro)}</p>`;
  h += `<section><h2>${esc(t.secEnded)}</h2>`;
  h += ended.length
    ? `<ul class="events">${ended.map(m => eventRow(m, state.events.get(m.id), today)).join('')}</ul>`
    : `<p class="muted">${esc(t.noArchived)}</p>`;
  h += '</section>';
  h += `<section><h2>${esc(t.wc2026)}</h2><p class="prose"><a class="link" href="/wc2026.html">${esc(t.wc2026)}</a></p>`
    + `<p class="muted">${esc(t.wc2026Note)}</p></section>`;
  h += `<p><a class="link" href="#/">${esc(t.back)}</a></p>`;
  return h;
}

// ── 路由与渲染 / router & render ──────────────────────────────────────────
function parseHash() {
  let h = location.hash || '#/';
  h = h.replace(/^#/, '');
  if (!h.startsWith('/')) h = '/' + h;
  const parts = h.split('/').filter(Boolean);
  if (parts[0] === 'e' && parts[1]) return { page: 'event', id: decodeURIComponent(parts[1]) };
  if (parts[0] === 'method') return { page: 'method' };
  if (parts[0] === 'archive') return { page: 'archive' };
  return { page: 'overview' };
}

function render(focusTab) {
  const t = L();
  document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
  document.documentElement.dataset.theme = state.theme;
  document.title = t.title;
  $('wordmark').textContent = t.brand;
  $('lang').textContent = state.lang === 'zh' ? 'EN' : '中文';
  $('lang').setAttribute('aria-label', t.langAria);
  $('theme').textContent = state.theme === 'dark' ? t.themeLight : t.themeDark;
  $('theme').setAttribute('aria-label', t.themeAria);

  const r = parseHash();
  const navItems = [['#/', t.nav.events, r.page === 'overview' || r.page === 'event'], ['#/method', t.nav.method, r.page === 'method'], ['#/archive', t.nav.archive, r.page === 'archive']];
  $('nav').setAttribute('aria-label', t.navAria);
  $('nav').innerHTML = navItems.map(([href, label, on]) => `<a href="${href}"${on ? ' aria-current="page"' : ''}>${esc(label)}</a>`).join('');

  let html;
  if (state.error) html = `<h1>${esc(t.loadFail)}</h1><p class="muted">${esc(state.error)}</p>`;
  else if (!state.booted) html = `<p class="muted" style="padding:32px 0">${esc(t.loading)}</p>`;
  else if (r.page === 'event') html = eventPage(r.id);
  else if (r.page === 'method') html = methodPage();
  else if (r.page === 'archive') html = archivePage();
  else html = overviewPage();
  $('view').innerHTML = html;

  $('foot').innerHTML = `<span>${esc(t.footNote)}</span><a class="link" href="#/method">${esc(t.nav.method)}</a><a class="link" href="/clear.html">${esc(t.footClear)}</a>`;
  wire();
  if (focusTab) {
    const b = document.querySelector('[role="tab"][aria-selected="true"]');
    if (b) b.focus();
  }
}

function wire() {
  const sel = $('leagueFilter');
  if (sel) sel.onchange = () => { state.weekLeague = sel.value; render(); };
  const chk = $('onlyGap');
  if (chk) chk.onchange = () => { state.weekGapOnly = chk.checked; render(); };
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.onclick = () => { state.tab = btn.dataset.tab; render(true); };
    btn.onkeydown = e => {
      const keys = [...document.querySelectorAll('[data-tab]')].map(b => b.dataset.tab);
      const i = keys.indexOf(state.tab);
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        const j = (i + (e.key === 'ArrowRight' ? 1 : keys.length - 1)) % keys.length;
        state.tab = keys[j]; render(true);
      }
    };
  });
}

// ── tooltip（鼠标悬停 + 键盘聚焦）────────────────────────────────────────
function showTip(el) {
  const tip = $('tip'), text = el.dataset.tip;
  if (!tip || !text) return;
  tip.textContent = text;
  tip.classList.add('on');
  tip.setAttribute('aria-hidden', 'false');
  const r = el.getBoundingClientRect(), tr = tip.getBoundingClientRect();
  let x = r.left + r.width / 2 - tr.width / 2;
  let y = r.top - tr.height - 8;
  if (y < 4) y = r.bottom + 8;
  x = Math.max(8, Math.min(window.innerWidth - tr.width - 8, x));
  tip.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
}
function hideTip() {
  const tip = $('tip');
  if (!tip) return;
  tip.classList.remove('on');
  tip.setAttribute('aria-hidden', 'true');
}

// ── 启动 / boot ───────────────────────────────────────────────────────────
$('lang').onclick = () => {
  state.lang = state.lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('fd-lang', state.lang);
  render();
};
$('theme').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('fd-theme', state.theme);
  render();
};

document.addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showTip(el);
});
document.addEventListener('mouseout', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) hideTip();
});
document.addEventListener('focusin', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showTip(el);
});
document.addEventListener('focusout', hideTip);

window.addEventListener('hashchange', () => { hideTip(); render(); window.scrollTo(0, 0); });

(async () => {
  try {
    const res = await fetch('/web/data/index.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('index.json ' + res.status);
    const idx = await res.json();
    state.index = Array.isArray(idx) ? idx : [];
  } catch (e) {
    state.error = String(e && e.message ? e.message : e);
    state.booted = true;
    render();
    return;
  }
  await Promise.all(state.index.map(async m => {
    try {
      const res = await fetch(`/web/data/${encodeURIComponent(m.id)}.json`, { cache: 'no-cache' });
      if (!res.ok) return;
      state.events.set(m.id, await res.json());
    } catch (e) { /* 单个赛事读失败不影响其它赛事 */ }
  }));
  state.booted = true;
  render();
})();
</script>
</body>
</html>
