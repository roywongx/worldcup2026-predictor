<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Major Tournament Predictor</title>
<style>
:root {
  --bg: #f6f8fa; --card: #fff; --text: #1f2328; --text2: #656d76; --text3: #8b949e;
  --blue: #0969da; --green: #1a7f37; --red: #cf222e; --orange: #bf8700; --purple: #8250df;
  --border: #d0d7de; --shadow: 0 1px 3px rgba(31,35,40,0.06), 0 1px 2px rgba(31,35,40,0.04);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', Helvetica, Arial, sans-serif; }
header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0.8rem 1.2rem; display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
header h1 { font-size: 1.1rem; margin: 0; flex: 1; }
select, button { font: inherit; padding: 0.3rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer; }
main { max-width: 1100px; margin: 0 auto; padding: 1rem; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 1rem; margin-bottom: 1rem; }
.card h2 { font-size: 1rem; margin: 0 0 0.6rem; }
.meta { color: var(--text2); font-size: 0.85rem; display: flex; gap: 1.2rem; flex-wrap: wrap; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
th { color: var(--text2); font-weight: 600; font-size: 0.8rem; }
th:first-child, td:first-child, td.l { text-align: left; }
.bar { position: relative; display: inline-block; min-width: 3.6rem; }
.bar i { position: absolute; left: 0; top: 15%; bottom: 15%; background: var(--blue); opacity: 0.15; border-radius: 3px; }
.bar.g i { background: var(--green); } .bar.p i { background: var(--purple); }
.heat td { text-align: center; padding: 0.15rem 0.2rem; font-size: 0.72rem; border-bottom: 1px solid var(--border); }
.heat th { text-align: center; padding: 0.15rem 0.2rem; font-size: 0.72rem; }
.heat th:first-child, .heat td:first-child { text-align: left; padding-right: 0.6rem; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 1rem; }
.match { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.4rem; align-items: center; padding: 0.3rem 0; border-bottom: 1px dashed var(--border); font-size: 0.85rem; }
.match .r { text-align: right; } .match .c { text-align: center; color: var(--text2); min-width: 7.5rem; }
.wdl { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 2px; }
.wdl span:nth-child(1) { background: var(--blue); } .wdl span:nth-child(2) { background: var(--text3); } .wdl span:nth-child(3) { background: var(--orange); }
.played { color: var(--green); font-weight: 600; }
.muted { color: var(--text3); font-size: 0.8rem; }
.scroll { overflow-x: auto; }
.empty { text-align: center; color: var(--text2); padding: 3rem 1rem; }
a { color: var(--blue); }
</style>
</head>
<body>
<header>
  <h1 id="title">Major Tournament Predictor</h1>
  <select id="event" aria-label="event"></select>
  <button id="lang">EN</button>
  <a href="/" id="wc26" class="muted">WC 2026</a>
</header>
<main id="app"><div class="empty" id="loading">…</div></main>
<script>
const T = {
  zh: {
    title: '重大赛事预测', wc26: '2026 世界杯页面', loading: '加载中…', none: '还没有模拟结果：运行 node engine/cli.js simulate <赛事>',
    asOf: '模型截至', data: '数据截至', sims: '模拟次数', played: '已赛', host: '东道主',
    odds: '夺冠与晋级概率', team: '球队', group: '组', elo: 'Elo', adv: '出线', champ: '夺冠',
    R32: '32强', R16: '16强', QF: '8强', SF: '4强', F: '决赛',
    groups: '小组', pos: ['第1', '第2', '第3', '第4'], likely: '最可能', xg: '期望进球',
    method: '方法与可信度',
    methodText: v => `Dixon-Coles 双泊松模型：球队攻防参数由 1872 年至今全部国家队 A 级赛按时间衰减加权拟合，并入 World Football Elo；`
      + `每场比赛的比分分布驱动 ${v.sims.toLocaleString()} 次蒙特卡洛模拟（小组排名含相互战绩，淘汰赛加时 + 点球）。`
      + `样本外检验（2017–2026 年 20 届洲际/世界大赛、911 场，逐比赛日滚动拟合，未参与调参）：RPS ${v.m.rps.toFixed(4)}（Elo 基线 ${v.e.rps.toFixed(4)}），`
      + `log-loss ${v.m.logLoss.toFixed(4)}（Elo ${v.e.logLoss.toFixed(4)}），校准误差 ECE ${v.m.ece.toFixed(3)}。这是概率，不是保证。`,
    approx: '注意：本赛事未提供官方第三名组合表，第三名对阵按约束近似分配。',
    groupTournaments: '国家队赛事', groupLeagues: '俱乐部联赛',
    table: '积分榜与概率', pld: '赛', pts: '积分', gd: '净胜', expPts: '期望积分', remaining: '剩余',
    heat: '名次概率（每队以第几名的概率，单位 %）', upcoming: '未来 14 天赛程：模型 vs 市场',
    modelWDL: '模型 胜/平/负', marketWDL: '市场 胜/平/负', date: '日期', fixture: '对阵',
    noFixtures: '未来 14 天没有该联赛的赛程（data/clubs/fixtures.csv 未下载或暂无安排）。',
    noMarket: '未找到市场赔率',
    seasonTitle: '赛季级检验（名次概率）',
    zone: '区间', titleZone: 'title（冠军）', top4Zone: 'top4（前 4）', bottom3Zone: 'bottom3（倒数 3）',
    fixedSigma: '固定实力 σ=0', withSigmaLabel: s => `含不确定性 σ=${s}`,
    predRange: '预测区间', avgPred: '平均预测', actualFreq: '实际频率',
    seasonTableTitle: 'title 校准',
  },
  en: {
    title: 'Major Tournament Predictor', wc26: 'WC 2026 page', loading: 'Loading…', none: 'No simulations yet: run node engine/cli.js simulate <event>',
    asOf: 'Model as of', data: 'Data through', sims: 'Simulations', played: 'Played', host: 'Host',
    odds: 'Title & progression odds', team: 'Team', group: 'Grp', elo: 'Elo', adv: 'Advance', champ: 'Win',
    R32: 'R32', R16: 'R16', QF: 'QF', SF: 'SF', F: 'Final',
    groups: 'Groups', pos: ['1st', '2nd', '3rd', '4th'], likely: 'Likely', xg: 'xG',
    method: 'Method & reliability',
    methodText: v => `Dixon-Coles bivariate Poisson: team attack/defence fitted on every full international since 1872 with time decay, blended with World Football Elo; `
      + `per-match score distributions drive ${v.sims.toLocaleString()} Monte Carlo runs (group tiebreakers incl. head-to-head, extra time + penalties). `
      + `Out-of-sample test (20 continental/world finals 2017–2026, 911 matches, refitted every matchday, not used for tuning): RPS ${v.m.rps.toFixed(4)} (Elo baseline ${v.e.rps.toFixed(4)}), `
      + `log-loss ${v.m.logLoss.toFixed(4)} (Elo ${v.e.logLoss.toFixed(4)}), calibration ECE ${v.m.ece.toFixed(3)}. These are probabilities, not guarantees.`,
    approx: 'Note: no official third-place table for this event; third-place pairings use a constraint-based approximation.',
    groupTournaments: 'National team tournaments', groupLeagues: 'Club leagues',
    table: 'Table & odds', pld: 'Pld', pts: 'Pts', gd: 'GD', expPts: 'xPts', remaining: 'Remaining',
    heat: 'Finish position probabilities (% per position)', upcoming: 'Next 14 days: model vs market',
    modelWDL: 'Model W/D/L', marketWDL: 'Market W/D/L', date: 'Date', fixture: 'Fixture',
    noFixtures: 'No fixtures for this league in the next 14 days (data/clubs/fixtures.csv missing or nothing scheduled).',
    noMarket: 'No market odds found',
    seasonTitle: 'Season-level test (finish-position odds)',
    zone: 'Zone', titleZone: 'title (champion)', top4Zone: 'top4 (top four)', bottom3Zone: 'bottom3 (last three)',
    fixedSigma: 'Fixed strength σ=0', withSigmaLabel: s => `With uncertainty σ=${s}`,
    predRange: 'Predicted range', avgPred: 'Mean prediction', actualFreq: 'Actual frequency',
    seasonTableTitle: 'title calibration',
  },
};
let lang = localStorage.getItem('mtp-lang') || 'zh', data = null, index = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pc = (x, d = 1) => x >= 0.9995 ? '100%' : x > 0 && x < 0.0005 ? '<0.1%' : (x * 100).toFixed(d) + '%';
const name = t => esc(lang === 'zh' && data.names[t] ? data.names[t] : t);
const bar = (x, cls = '') => `<span class="bar ${cls}"><i style="width:${(x * 100).toFixed(1)}%"></i>${pc(x)}</span>`;

function renderOdds() {
  const L = T[lang], rounds = data.rounds;
  let h = `<div class="card"><h2>${L.odds}</h2><div class="scroll"><table><tr><th>${L.team}</th><th>${L.group}</th><th>${L.elo}</th><th>${L.adv}</th>`;
  for (const r of rounds.slice(1)) h += `<th>${L[r] || r}</th>`;
  h += `<th>${L.champ}</th></tr>`;
  for (const t of data.teams) {
    h += `<tr><td>${name(t.team)}${data.event.host.includes(t.team) ? ` <span class="muted">(${L.host})</span>` : ''}</td><td>${t.group}</td><td>${t.elo}</td><td>${bar(t.advance, 'g')}</td>`;
    for (const r of rounds.slice(1)) h += `<td>${bar(t.reach[r])}</td>`;
    h += `<td>${bar(t.champion, 'p')}</td></tr>`;
  }
  return h + '</table></div></div>';
}

function renderGroups() {
  const L = T[lang];
  let h = `<div class="card"><h2>${L.groups}</h2><div class="groups">`;
  for (const g of Object.keys(data.groupMatches)) {
    const teams = data.teams.filter(t => t.group === g).sort((a, b) => b.position[0] + b.position[1] - a.position[0] - a.position[1]);
    h += `<div><table><tr><th>${g}</th>${L.pos.map(p => `<th>${p}</th>`).join('')}</tr>`;
    for (const t of teams) h += `<tr><td>${name(t.team)}</td>${t.position.map(p => `<td>${pc(p, 0)}</td>`).join('')}</tr>`;
    h += '</table>';
    for (const m of data.groupMatches[g]) {
      const c = m.played ? `<span class="played">${m.played[0]} - ${m.played[1]}</span>`
        : `${pc(m.pA, 0)} / ${pc(m.pD, 0)} / ${pc(m.pB, 0)}<div class="wdl"><span style="width:${m.pA * 100}%"></span><span style="width:${m.pD * 100}%"></span><span style="width:${m.pB * 100}%"></span></div>`
          + `<div class="muted">${L.likely} ${m.likely[0]}-${m.likely[1]} · ${L.xg} ${m.xgA}-${m.xgB}</div>`;
      h += `<div class="match"><div class="r">${name(m.a)}</div><div class="c">${c}</div><div>${name(m.b)}</div></div>`;
    }
    h += '</div>';
  }
  return h + '</div></div>';
}

function wdlCell(p) {
  return `${pc(p[0], 0)} / ${pc(p[1], 0)} / ${pc(p[2], 0)}<div class="wdl"><span style="width:${p[0] * 100}%"></span><span style="width:${p[1] * 100}%"></span><span style="width:${p[2] * 100}%"></span></div>`;
}

const seasonLabel = s => `${s.slice(0, 2)}/${s.slice(2)}`;
const zoneLabel = z => (lang === 'zh' ? z.label || z.key : z.labelEn || z.key);

// 俱乐部联赛：积分榜 + 名次概率热力表 + 未来赛程，方法与可信度如实对比市场
function renderLeague() {
  const L = T[lang], d = data, lg = d.league, n = d.teams.length, v = d.validation;
  let h = `<div class="card"><h2>${esc(lang === 'zh' ? lg.nameZh || lg.name : lg.name)} <span class="muted">${seasonLabel(lg.season)}</span></h2><div class="meta">`
    + `<span>${esc(lg.start)} ~ ${esc(lg.end)}</span><span>${L.asOf} ${esc(d.asOf)}</span><span>${L.data} ${esc(d.dataThrough)}</span>`
    + `<span>${L.sims} ${d.sims.toLocaleString()}</span><span>${L.played} ${d.played}</span><span>${L.remaining} ${d.remaining}</span></div></div>`;

  h += `<div class="card"><h2>${L.table}</h2><div class="scroll"><table><tr><th>#</th><th>${L.team}</th><th>${L.pld}</th><th>${L.pts}</th><th>${L.gd}</th><th>${L.expPts}</th>`;
  for (const z of d.zonesDef) h += `<th>${esc(zoneLabel(z))}</th>`;
  h += `<th>${L.elo}</th></tr>`;
  for (const t of d.teams) {
    const c = t.current;
    h += `<tr><td>${t.position}</td><td class="l">${name(t.team)}</td><td>${c.p}</td><td>${c.pts}</td>`
      + `<td>${c.gd > 0 ? '+' + c.gd : c.gd}</td><td>${t.expectedPts.toFixed(1)}</td>`;
    for (const z of d.zonesDef) h += `<td>${bar(t.zones[z.key] || 0, z.key === 'title' ? 'p' : z.key === 'ucl' ? 'g' : '')}</td>`;
    h += `<td>${t.elo}</td></tr>`;
  }
  h += '</table></div></div>';

  h += `<div class="card"><h2>${L.heat}</h2><div class="scroll"><table class="heat"><tr><th></th>${Array.from({ length: n }, (_, i) => `<th>${i + 1}</th>`).join('')}</tr>`;
  for (const t of d.teams) {
    h += `<tr><td>${name(t.team)}</td>`;
    for (const p of t.positions) {
      if (p < 0.005) { h += '<td></td>'; continue; }
      const a = (0.08 + p * 0.8).toFixed(2);
      h += `<td style="background:rgba(9,105,218,${a});${p > 0.5 ? 'color:#fff;font-weight:600' : ''}">${Math.round(p * 100)}</td>`;
    }
    h += '</tr>';
  }
  h += '</table></div></div>';

  h += `<div class="card"><h2>${L.upcoming}</h2>`;
  if (!d.upcoming.length) h += `<p class="muted">${L.noFixtures}</p>`;
  else {
    h += `<div class="scroll"><table><tr><th>${L.date}</th><th>${L.fixture}</th><th>${L.modelWDL}</th><th>${L.marketWDL}</th><th>${L.xg}</th></tr>`;
    for (const m of d.upcoming) {
      h += `<tr><td class="l">${esc(m.date.slice(5))}</td><td class="l">${name(m.home)} vs ${name(m.away)}</td>`
        + `<td>${wdlCell([m.pH, m.pD, m.pA])}</td><td>${m.market ? wdlCell(m.market) : '—'}</td>`
        + `<td>${m.xgH.toFixed(2)}-${m.xgA.toFixed(2)}</td></tr>`;
    }
    h += '</table></div>';
  }
  h += '</div>';

  if (v && v.model) h += `<div class="card"><h2>${L.method}</h2><p class="muted">${esc(leagueMethodText(v))}</p>${seasonBlock(v)}</div>`;
  return h;
}

// 赛季级检验：固定实力（σ=0）vs 含不确定性，以及 title 校准小表；数字全部来自 clubmodel.json 的 season.test
function seasonBlock(v) {
  const s = v.season;
  if (!s || !s.fixed || !s.withSigma || !s.n) return '';
  const L = T[lang], a = s.fixed, b = s.withSigma;
  const zoneLabel = { title: L.titleZone, top4: L.top4Zone, bottom3: L.bottom3Zone };
  const num = x => x.toFixed(4), pct = x => (x * 100).toFixed(1) + '%';
  const tdc = (x, y) => `<td>${num(x) !== num(y) && x < y ? '<strong>' + num(x) + '</strong>' : num(x)}</td>`;
  const sg = s.seasons || {};
  const range = `${seasonLabel(sg.from || '1718')}–${seasonLabel(sg.to || '2526')}`;
  const diff = b.meanBrier - a.meanBrier;
  const verdict = lang === 'zh'
    ? (diff < -0.0005 ? `含不确定性更好（平均 Brier 低 ${(-diff).toFixed(5)}）`
      : diff > 0.0005 ? `含不确定性更差（平均 Brier 高 ${diff.toFixed(5)}）`
        : `含不确定性与固定实力基本持平（平均 Brier 差 ${diff >= 0 ? '+' : ''}${diff.toFixed(5)}，量级等同噪声）`)
    : (diff < -0.0005 ? `Uncertainty is better (mean Brier lower by ${(-diff).toFixed(5)})`
      : diff > 0.0005 ? `Uncertainty is worse (mean Brier higher by ${diff.toFixed(5)})`
        : `Uncertainty is essentially level with fixed strength (mean Brier difference ${diff >= 0 ? '+' : ''}${diff.toFixed(5)}, i.e. noise)`);
  const lead = lang === 'zh'
    ? `比较两种模拟对最终名次的 Brier（越低越好，较好的加粗）：固定实力（σ=0）与每次模拟给每队抽实力扰动 σ=${b.sigma}。`
      + `${range} 赛季、${s.seasonCount} 个赛季 × ${s.divisionSeasons} 个联赛-赛季、检查点 ${(s.checkpoints || []).join(' / ')}、每个检查点 ${s.sims.toLocaleString()} 次模拟，`
      + `n = ${s.n.toLocaleString()} 个球队-赛季-检查点；${(s.skipped || []).length} 个不完整赛季已跳过。${verdict}。页面上的名次概率用 σ=${b.sigma}。`
    : `Finish-position Brier for two simulation modes (lower is better, better value in bold): fixed strength (σ=0) and a per-team strength draw σ=${b.sigma}. `
      + `Seasons ${range}, ${s.seasonCount} seasons × ${s.divisionSeasons} league-seasons, checkpoints ${(s.checkpoints || []).join(' / ')}, ${s.sims.toLocaleString()} simulations each, `
      + `n = ${s.n.toLocaleString()} team-season-checkpoints; ${(s.skipped || []).length} incomplete season(s) skipped. ${verdict}. The odds on this page use σ=${b.sigma}.`;

  let h = `<p class="muted"><strong>${esc(L.seasonTitle)}</strong>${lang === 'zh' ? '：' : ': '}${esc(lead)}</p>`;
  h += `<table><tr><th>${esc(L.zone)}</th><th>${esc(L.fixedSigma)}</th><th>${esc(L.withSigmaLabel(b.sigma))}</th></tr>`;
  for (const k of ['title', 'top4', 'bottom3']) h += `<tr><td class="l">${esc(zoneLabel[k])}</td>${tdc(a[k].brier, b[k].brier)}${tdc(b[k].brier, a[k].brier)}</tr>`;
  h += `</table><p class="muted">${esc(L.seasonTableTitle)}${lang === 'zh' ? `（σ=${b.sigma}）：` : ` (σ=${b.sigma}):`}</p>`;
  h += `<table><tr><th>${esc(L.predRange)}</th><th>n</th><th>${esc(L.avgPred)}</th><th>${esc(L.actualFreq)}</th></tr>`;
  for (const bin of ((b.calibration && b.calibration.title) || [])) {
    if (!bin.n) continue;
    h += `<tr><td class="l">${(bin.lo * 100).toFixed(0)}–${(bin.hi * 100).toFixed(0)}%</td><td>${bin.n}</td><td>${pct(bin.pred)}</td><td>${pct(bin.freq)}</td></tr>`;
  }
  return h + '</table>';
}

function leagueMethodText(v) {
  const d = data, m = v.model, mk = v.market, e = v.eloBaseline;
  const s = v.seasons || {};
  const from = seasonLabel(s.from || '1718'), to = seasonLabel(s.to || '2526');
  const better = mk && m.rps < mk.rps;
  if (lang === 'zh') {
    return `Dixon-Coles 双泊松模型：五大联赛攻防参数由 football-data.co.uk 的各赛季俱乐部比赛（含次级联赛，用于给升班马定级）按时间衰减加权拟合，并入 World Football Elo；`
      + `剩余 ${d.remaining} 场按比分矩阵抽样 ${d.sims.toLocaleString()} 次，名次按各联赛同分规则（含相互战绩）排定。`
      + `样本外检验（${from}–${to} 赛季、${m.n} 场、每 7 天只用当天之前的比赛重拟合，未参与调参）：`
      + `模型 RPS ${m.rps.toFixed(4)}${mk ? `，市场 ${mk.rps.toFixed(4)}` : ''}，Elo 基线 ${e.rps.toFixed(4)}；`
      + `${mk ? (better ? `模型略优于市场（低 ${(mk.rps - m.rps).toFixed(4)}）` : `模型不如市场（高 ${(m.rps - mk.rps).toFixed(4)}）`) : '缺少市场概率，无法对比'}。`
      + `命中率 ${(m.accuracy * 100).toFixed(1)}%${mk ? `（市场 ${(mk.accuracy * 100).toFixed(1)}%）` : ''}，`
      + `log-loss ${m.logLoss.toFixed(4)}${mk ? `（市场 ${mk.logLoss.toFixed(4)}）` : ''}，校准误差 ECE ${m.ece.toFixed(4)}。这些是概率，不是保证。`;
  }
  return `Dixon-Coles bivariate Poisson: attack/defence fitted on football-data.co.uk club seasons (incl. second tiers, so promoted teams are rated) with time decay, blended with World Football Elo; `
    + `the ${d.remaining} remaining matches are sampled from score matrices ${d.sims.toLocaleString()} times, ranked by each league's own tie-break rules (incl. head-to-head). `
    + `Out-of-sample test (${from}–${to}, ${m.n} matches, refitted every 7 days using only earlier matches, not used for tuning): `
    + `model RPS ${m.rps.toFixed(4)}${mk ? `, market ${mk.rps.toFixed(4)}` : ''}, Elo baseline ${e.rps.toFixed(4)}; `
    + `${mk ? (better ? `the model edges the market by ${(mk.rps - m.rps).toFixed(4)}` : `the model is worse than the market by ${(m.rps - mk.rps).toFixed(4)}`) : 'no market probabilities, no comparison possible'}. `
    + `Hit rate ${(m.accuracy * 100).toFixed(1)}%${mk ? ` (market ${(mk.accuracy * 100).toFixed(1)}%)` : ''}, `
    + `log-loss ${m.logLoss.toFixed(4)}${mk ? ` (market ${mk.logLoss.toFixed(4)})` : ''}, calibration ECE ${m.ece.toFixed(4)}. These are probabilities, not guarantees.`;
}

function renderTournament() {
  const L = T[lang];
  const v = data.validation;
  let h = `<div class="card"><h2>${esc(lang === 'zh' ? data.event.nameZh || data.event.name : data.event.name)}</h2><div class="meta">`
    + `<span>${esc(data.event.start)} ~ ${esc(data.event.end)}</span><span>${L.asOf} ${esc(data.asOf)}</span><span>${L.data} ${esc(data.dataThrough)}</span>`
    + `<span>${L.sims} ${data.sims.toLocaleString()}</span><span>${L.played} ${data.playedMatches}</span></div>`;
  if (data.approximateThirdsShare > 0) h += `<p class="muted">${L.approx}</p>`;
  h += '</div>' + renderOdds() + renderGroups();
  if (v) h += `<div class="card"><h2>${L.method}</h2><p class="muted">${esc(L.methodText({ sims: data.sims, m: v.model, e: v.eloBaseline }))}</p></div>`;
  return h;
}

function render() {
  const L = T[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  $('title').textContent = L.title; $('lang').textContent = lang === 'zh' ? 'EN' : '中文'; $('wc26').textContent = L.wc26;
  document.title = L.title;
  const curId = data ? (data.kind === 'league' ? data.league.id : data.event.id) : null;
  const kindOf = e => e.kind === 'league' ? 'league' : 'tournament';
  $('event').innerHTML = [['tournament', L.groupTournaments], ['league', L.groupLeagues]].map(([k, label]) => {
    const items = index.filter(e => kindOf(e) === k);
    if (!items.length) return '';
    return `<optgroup label="${esc(label)}">` + items.map(e =>
      `<option value="${esc(e.id)}"${e.id === curId ? ' selected' : ''}>${esc(lang === 'zh' ? e.nameZh || e.name : e.name)}</option>`).join('') + '</optgroup>';
  }).join('');
  if (!data) { $('app').innerHTML = `<div class="empty">${index.length ? L.loading : L.none}</div>`; return; }
  $('app').innerHTML = data.kind === 'league' ? renderLeague() : renderTournament();
}

async function load(id) {
  data = null; render();
  data = await (await fetch(`/web/data/${encodeURIComponent(id)}.json`, { cache: 'no-cache' })).json();
  history.replaceState(null, '', `?event=${encodeURIComponent(id)}`);
  render();
}

$('lang').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('mtp-lang', lang); render(); };
$('event').onchange = e => load(e.target.value);
(async () => {
  try { index = await (await fetch('/web/data/index.json', { cache: 'no-cache' })).json(); } catch { index = []; }
  const want = new URLSearchParams(location.search).get('event');
  const pick = index.find(e => e.id === want) || index[0];
  if (pick) await load(pick.id); else render();
})();
</script>
</body>
</html>
